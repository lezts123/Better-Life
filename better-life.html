<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BETTER LIFE</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--cd:#fff;--tx:#23302a;--mu:#6b7a70;--g:#7d9b80;--gd:#4e6e53;--gl:#e6efe6;--cr:#f3ecdc;--bd:#e8e6dc;--sh:0 4px 22px rgba(60,80,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a16;--cd:#1d2620;--tx:#e8efe9;--mu:#9aaa9f;--gl:#27352b;--cr:#2b2a22;--bd:#2e3a31;--sh:none;--g:#8fae92}}
:root[data-theme=dark]{--bg:#141a16;--cd:#1d2620;--tx:#e8efe9;--mu:#9aaa9f;--gl:#27352b;--cr:#2b2a22;--bd:#2e3a31;--sh:none;--g:#8fae92}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 8px}h2{font-size:22px}h3{font-size:16px}p{margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
#app{display:flex;min-height:100%}#side{width:220px;padding:22px 14px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;background:var(--cd)}
.logo{font-weight:800;letter-spacing:.08em;color:var(--gd);font-size:18px;margin:0 10px 22px}.logo small{display:block;font-weight:500;letter-spacing:0;color:var(--mu);font-size:11px}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;color:var(--mu);cursor:pointer;font-weight:600;border:0;background:none;width:100%;font:inherit;font-weight:600;text-align:left;transition:.2s}
.nv.on{background:var(--gl);color:var(--gd)}.nv:hover{background:var(--gl)}
#main{flex:1;padding:26px;max-width:1000px;margin:0 auto;width:100%;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.cd{background:var(--cd);border-radius:20px;padding:18px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:16px}
.gr{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.gr .cd{margin:0}

.btn.s{background:var(--gl);color:var(--gd)}.btn.r{background:#b4574d}.btn.x{padding:6px 11px;font-size:13px;border-radius:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.btn{flex:none}
.chip{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--gl);color:var(--gd);font-weight:600;font-size:13px;cursor:pointer;margin:0 6px 6px 0;border:0;font-family:inherit}.chip.on{background:var(--gd);color:#fff}
.bar{height:9px;border-radius:9px;background:var(--gl);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.fd{display:flex;gap:12px;align-items:center;cursor:pointer}.em{font-size:30px;background:var(--cr);border-radius:16px;width:54px;height:54px;display:grid;place-items:center;flex:none}
.tag{font-size:11px;background:var(--cr);color:#7a6a3a;border-radius:8px;padding:2px 7px;font-weight:600}
#mod{position:fixed;inset:0;background:rgba(20,30,22,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#mod.on{display:flex}
#mb{background:var(--cd);border-radius:24px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:left;font-size:14px}th{color:var(--mu);font-size:12px}td input{padding:6px 8px;width:80px}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,var(--gl),var(--cr))}
.hero .big{font-size:88px}.hero h1{font-size:40px;letter-spacing:.1em;color:var(--gd)}
.acc summary{cursor:pointer;font-weight:700;padding:6px 0}.num{font-size:26px;font-weight:800;color:var(--gd)}
#bn{display:none}
@media(max-width:760px){#side{display:none}#main{padding:16px 14px 90px}#bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;justify-content:space-around}
#bn button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}#bn button b{font-size:19px}#bn .on{color:var(--gd)}}
</style></head><body><div id="root"></div><div id="mod"><div id="mb"></div></div><div id="toast"></div>
<script>
const I={nasi:['Nasi putih',130,2.7,28,.3,.4],telur:['Telur ayam',154,12.4,.7,10.8,0],minyak:['Minyak goreng',884,0,0,100,0],kecap:['Kecap manis',175,2,41,.1,0],bawang:['Bawang merah/putih',40,1.1,9,.1,1.7],ayam:['Daging ayam',215,18,0,15.5,0],sapi:['Daging sapi',207,19,0,14,0],kambing:['Daging kambing',145,21,0,6,0],santan:['Santan',200,2,3,21,0],tempe:['Tempe',193,19,9,11,1.4],tahu:['Tahu',76,8,1.9,4.8,.3],mie:['Mie kuning basah',138,3.4,25,2.1,1],kentang:['Kentang',77,2,17,.1,2.2],kol:['Kol',25,1.3,5.8,.1,2.5],kacang:['Kacang tanah',567,26,16,49,8.5],tauge:['Tauge',30,3,6,.2,1.8],timun:['Timun',15,.7,3.6,.1,.5],sayur:['Sayur campur',25,2.5,4,.3,2],bakso:['Bakso sapi',180,10,12,10,.5],cabai:['Cabai',40,1.9,8.8,.4,1.5],terigu:['Tepung terigu',364,10,76,1,2.7],tapioka:['Tepung tapioka',358,.2,88,0,.9],ikan:['Ikan tenggiri',117,22,0,2.5,0],gula:['Gula',387,0,100,0,0],susu:['Susu sapi',61,3.2,4.8,3.3,0],nangka:['Nangka muda',50,2,11,.4,2.5],bumbu:['Bumbu halus',60,1.5,10,1.5,1.5],kuah:['Kuah/kaldu',5,.5,.5,.2,0],pisang:['Pisang',89,1.1,23,.3,2.6]};
const M={rebus:['Rebus/Kukus',0],panggang:['Panggang',3],tumis:['Tumis',10],goreng:['Goreng',20]};
const CATS=['Semua','Nasi','Lauk','Sayur','Berkuah','Jajanan','Camilan'];
// id,nama,kategori,emoji,metode,tag(b=sarapan,l=siang,d=malam,s=camilan),porsi,bahan
const F=[['nasi','Nasi putih','Nasi','🍚','rebus','bld','1 piring','nasi:150'],['nasgor','Nasi goreng','Nasi','🍛','tumis','bl','1 piring','nasi:150,telur:55,kecap:10,bawang:10'],['uduk','Nasi uduk','Nasi','🍚','rebus','b','1 piring','nasi:150,santan:40,bawang:5'],['kuning','Nasi kuning','Nasi','🍚','rebus','bl','1 piring','nasi:150,santan:40,bumbu:5'],['rendang','Rendang','Lauk','🥩','rebus','ld','2 potong','sapi:80,santan:60,bumbu:30,cabai:10'],['ayamg','Ayam goreng','Lauk','🍗','goreng','ld','1 potong','ayam:100,bumbu:10'],['ayamb','Ayam bakar','Lauk','🍗','panggang','ld','1 potong','ayam:100,kecap:10,bumbu:10'],['satea','Sate ayam','Lauk','🍢','panggang','ld','10 tusuk','ayam:100,kecap:10,kacang:25,bumbu:10'],['satek','Sate kambing','Lauk','🍢','panggang','ld','5 tusuk','kambing:100,kecap:10,bawang:10'],['gado','Gado-gado','Sayur','🥗','rebus','ld','1 porsi','kentang:50,kol:40,tauge:30,tahu:40,telur:55,kacang:40,gula:5,cabai:5'],['ketoprak','Ketoprak','Sayur','🥗','rebus','l','1 porsi','tahu:50,tauge:40,nasi:100,kacang:35,kecap:10'],['pecel','Pecel','Sayur','🥗','rebus','bld','1 porsi','sayur:100,tauge:30,kacang:35,tempe:30,gula:5'],['soto','Soto ayam','Berkuah','🍲','rebus','ld','1 mangkuk','ayam:60,nasi:100,tauge:20,telur:30,bumbu:10,kuah:200'],['rawon','Rawon','Berkuah','🍲','rebus','ld','1 mangkuk','sapi:70,tauge:20,bumbu:20,kuah:250,nasi:100'],['bakso','Bakso','Berkuah','🍜','rebus','ld','1 mangkuk','bakso:120,mie:80,tauge:15,kuah:250'],['mieayam','Mie ayam','Berkuah','🍜','tumis','ld','1 mangkuk','mie:150,ayam:50,sayur:20,kecap:10'],['seblak','Seblak','Jajanan','🌶️','tumis','s','1 porsi','tapioka:60,telur:55,sayur:40,cabai:10,bumbu:10'],['pempek','Pempek','Jajanan','🐟','goreng','s','3 buah','ikan:60,tapioka:50,gula:10'],['siomay','Siomay','Jajanan','🥟','rebus','ls','1 porsi','ikan:60,tapioka:20,kentang:50,kol:40,tahu:30,kacang:25'],['batagor','Batagor','Jajanan','🥟','goreng','s','5 buah','ikan:70,tapioka:25,tahu:30,kacang:25,kecap:10'],['tempeg','Tempe goreng','Lauk','🟫','goreng','bld','2 potong','tempe:50'],['tahug','Tahu goreng','Lauk','🟨','goreng','bld','2 potong','tahu:80'],['perkedel','Perkedel','Lauk','🥔','goreng','bld','2 buah','kentang:80,sapi:15,telur:20,bawang:5'],['balado','Telur balado','Lauk','🥚','tumis','bld','1 butir','telur:55,cabai:20,bawang:15'],['asem','Sayur asem','Sayur','🥬','rebus','ld','1 mangkuk','sayur:150,kacang:20,nangka:30,kuah:200,gula:3'],['opor','Opor ayam','Lauk','🍲','rebus','ld','1 porsi','ayam:100,santan:80,bumbu:15'],['gudeg','Gudeg','Lauk','🍲','rebus','bl','1 porsi','nangka:150,santan:60,telur:55,gula:10,nasi:100'],['martabak','Martabak telur','Jajanan','🥘','goreng','ds','1 potong','terigu:40,telur:110,sapi:40,bawang:20'],['bubur','Bubur ayam','Nasi','🥣','rebus','b','1 mangkuk','nasi:100,kuah:250,ayam:40,kecap:5,bawang:5'],['pisang','Pisang','Camilan','🍌','rebus','s','1 buah','pisang:100'],['susu','Susu sapi','Camilan','🥛','rebus','bs','1 gelas','susu:200']].map(a=>({id:a[0],n:a[1],c:a[2],e:a[3],m:a[4],t:a[5],po:a[6],k:a[7].split(',').map(x=>{const[i,g]=x.split(':');return{id:i,g:+g}})}));
const MEAL={b:'Sarapan',l:'Makan siang',d:'Makan malam',s:'Camilan'};
const ACT=['Sedentary (jarang beraktivitas)','Lightly Active (ringan)','Moderately Active (sedang)','Very Active (tinggi)','Extra Active (sangat tinggi)'];
const GOAL={mnt:'Menjaga berat badan',hab:'Membangun kebiasaan makan sehat',fit:'Meningkatkan kebugaran',grw:'Mendukung pertumbuhan & perkembangan tubuh'};
const EDU=[['Apa itu kalori?','Kalori adalah satuan energi dari makanan dan minuman. Tubuh memakainya untuk bernapas, bergerak, berpikir, dan memperbaiki sel. Kebutuhan tiap orang berbeda tergantung usia, tubuh, dan aktivitas.'],['Apa itu protein?','Protein membangun dan memperbaiki otot, enzim, serta sistem imun. Sumbernya: telur, ikan, ayam, tempe, tahu, dan kacang-kacangan. 1 gram protein = 4 kkal.'],['Apa itu karbohidrat?','Karbohidrat adalah sumber energi utama, terutama untuk otak dan otot. Pilih yang kaya serat seperti nasi merah, umbi, dan sayur. 1 gram = 4 kkal.'],['Apa itu lemak?','Lemak dibutuhkan untuk menyerap vitamin A, D, E, K dan menjaga hormon. Utamakan lemak tak jenuh (ikan, kacang, alpukat) dan batasi gorengan berlebih. 1 gram = 9 kkal.'],['Apa itu serat?','Serat melancarkan pencernaan dan membuat kenyang lebih lama. Sumbernya sayur, buah, kacang-kacangan, dan biji-bijian utuh. Kebutuhan umum sekitar 14 g per 1000 kkal.'],['Vitamin dan mineral','Vitamin dan mineral dibutuhkan dalam jumlah kecil namun penting untuk imun, tulang, dan energi. Makan beragam sayur, buah, dan lauk adalah cara terbaik memenuhinya.'],['Cara membaca label nutrisi','Periksa dulu takaran saji dan jumlah sajian per kemasan. Lalu lihat energi, gula, lemak jenuh, dan natrium. Bandingkan per 100 g agar adil antar produk.'],['Pentingnya sarapan','Sarapan membantu energi dan konsentrasi di pagi hari. Pilih kombinasi karbohidrat, protein, dan serat, misalnya nasi, telur, dan sayur atau buah.'],['Pola makan seimbang','Pedoman Isi Piringku Kemenkes: separuh piring sayur dan buah, separuh lainnya karbohidrat dan lauk-pauk, ditambah air putih cukup.'],['Pentingnya tidur','Tidur cukup membantu pemulihan tubuh, hormon lapar, dan suasana hati. Remaja umumnya butuh 8-10 jam, dewasa 7-9 jam per malam.'],['Aktivitas fisik dan kesehatan','Aktivitas fisik menjaga jantung, otot, tulang, dan mood. Dewasa dianjurkan sekitar 150 menit aktivitas sedang per minggu.'],['Menjaga pola hidup sehat','Mulai dari kebiasaan kecil yang konsisten: catat makan, cukup minum, bergerak setiap hari, tidur teratur. Konsistensi lebih penting daripada kesempurnaan.']];
let S;try{S=JSON.parse(localStorage.getItem('bl1'))}catch(e){}S=S||{p:null,log:{},w:{},sl:{},ac:{},rc:[],rm:{on:false,t:['07:30','12:30','19:00'],w:false}};
const save=()=>{try{localStorage.setItem('bl1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('sv')};
let page='home',rng=7,q='',cat='Semua',rf='b',cur=null,ob=0;
const r1=x=>Math.round(x*10)/10;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function T(p){const{w,h,a}=p,bmr=10*w+6.25*h-5*a+(p.s=='m'?5:-161),tdee=bmr*[1.2,1.375,1.55,1.725,1.9][p.act],minor=a<18,k=Math.round(tdee*(!minor&&p.g=='fit'?1.05:1)/10)*10,prot=Math.round(w*(minor?1:p.g=='fit'?1.4:1.2)),fat=Math.round(k*.28/9);return{minor,bmi:w/((h/100)**2),bmr:Math.round(bmr),tdee:Math.round(tdee),k,prot,fat,carb:Math.round((k-prot*4-fat*9)/4),fib:Math.round(k/1000*14),water:Math.round(w*35/50)*50}}
function calc(items,m,mult){const t={k:0,p:0,c:0,f:0,fi:0,g:0},add=(id,g)=>{const i=I[id];if(!i)return;const x=g*mult/100;t.k+=i[1]*x;t.p+=i[2]*x;t.c+=i[3]*x;t.f+=i[4]*x;t.fi+=i[5]*x;t.g+=g*mult};items.forEach(i=>add(i.id,i.g));add('minyak',M[m][1]);return t}
function tot(d){const t={k:0,p:0,c:0,f:0,fi:0};(S.log[d]||[]).forEach(e=>{for(const x in t)t[x]+=e[x]});return t}
function ring(v,max,col,l,u){const p=Math.min(1,v/max||0),R=46,C=2*Math.PI*R;return`<div style="text-align:center"><svg viewBox="0 0 110 110" width="120"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--gl)" stroke-width="10"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 55 55)" style="transition:.6s"/><text x="55" y="53" text-anchor="middle" font-size="17" font-weight="800" fill="var(--tx)">${Math.round(v)}</text><text x="55" y="69" text-anchor="middle" font-size="9" fill="var(--mu)">/ ${Math.round(max)} ${u}</text></svg><div class="mu"><b>${l}</b></div></div>`}
function bars(v,lb,col,goal){const mx=Math.max(...v,goal||0,1),n=v.length,w=300/n;return`<svg viewBox="0 0 300 110" width="100%">${goal?`<line x1="0" x2="300" y1="${85-75*goal/mx}" y2="${85-75*goal/mx}" stroke="var(--mu)" stroke-dasharray="3 3" stroke-width=".7"/>`:''}${v.map((x,i)=>`<rect x="${i*w+w*.15}" y="${85-75*x/mx}" width="${w*.7}" height="${Math.max(1,75*x/mx)}" rx="3" fill="${col}"/><text x="${i*w+w/2}" y="100" text-anchor="middle" font-size="${n>10?5:9}" fill="var(--mu)">${n>10&&i%5?'':lb[i]}</text>`).join('')}</svg>`}
function mac(l,v,g,u){return`<div style="margin:9px 0"><div class="row" style="justify-content:space-between;gap:4px"><b style="font-size:13px">${l}</b><span class="mu" style="text-align:right">${r1(v)} / ${g} ${u}</span></div><div class="bar"><i style="width:${Math.min(100,100*v/g)}%"></i></div></div>`}
// ---------- pages
function home(){const p=S.p,t=T(p),d=day(),s=tot(d),w=S.w[d]||0,hr=new Date().getHours();
const meals=Object.keys(MEAL).map(m=>{const l=(S.log[d]||[]).filter(e=>e.m==m);return`<div class="li"><b>${MEAL[m]}</b><span class="mu" style="text-align:right">${l.length?esc(l.map(e=>e.n).join(', ')):'Belum dicatat'}</span></div>`}).join('');
const wk=[6,5,4,3,2,1,0].map(o=>day(o));
return`<h2>${hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam'}, ${esc(p.n)} 👋</h2><p class="mu">Build Better Habits, Live a Better Life.</p>
${t.minor?`<div class="cd" style="background:var(--cr)"><b>Catatan usia di bawah 18 tahun</b><p class="mu" style="margin:4px 0 0">Angka di sini adalah estimasi kebutuhan energi, bukan target diet. Kebutuhan remaja bergantung pada tahap pertumbuhan; konsultasikan dengan dokter atau ahli gizi.</p></div>`:''}
<div class="cd"><div class="row" style="justify-content:space-around">${ring(s.k,t.k,'var(--g)','Energi','kkal')}${ring(w,t.water,'#6fa8c7','Air','ml')}<div style="min-width:200px">${mac('Protein',s.p,t.prot,'g')}${mac('Karbohidrat',s.c,t.carb,'g')}${mac('Lemak',s.f,t.fat,'g')}${mac('Serat',s.fi,t.fib,'g')}</div></div></div>
<div class="gr"><div class="cd"><h3>Today's Nutrition Summary</h3>${meals}<button class="btn s x" style="margin-top:10px" onclick="go('log')">Catat makanan</button></div>
<div class="cd"><h3>Energi 7 hari terakhir (kkal)</h3>${bars(wk.map(x=>Math.round(tot(x).k)),wk.map(x=>x.slice(8)),'var(--g)',t.k)}</div>
<div class="cd"><h3>Water Tracker</h3>${water(true)}</div></div>
<div class="cd"><h3>Kalkulator kesehatan</h3><div class="gr" style="gap:10px">${[['BMI',r1(t.bmi),t.minor?'Interpretasi remaja memerlukan kurva pertumbuhan WHO':bmiCat(t.bmi)],['BMR',t.bmr+' kkal','Energi saat istirahat (Mifflin-St Jeor)'],['TDEE',t.tdee+' kkal','Total energi harian'],['Target energi',t.k+' kkal',GOAL[p.g]],['Protein / Karbo / Lemak',t.prot+' / '+t.carb+' / '+t.fat+' g','Estimasi harian'],['Cairan',t.water+' ml','Sekitar 35 ml per kg']].map(x=>`<div><div class="mu">${x[0]}</div><div class="num">${x[1]}</div><div class="mu">${x[2]}</div></div>`).join('')}</div></div>`}
function bmiCat(b){return b<18.5?'Berat badan kurang':b<=25?'Normal':b<=27?'Berat badan lebih':'Obesitas'}
function water(c){const d=day(),w=S.w[d]||0,g=T(S.p).water;return`<div class="num">${w} <span class="mu">/ ${g} ml</span></div><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,100*w/g)}%;background:#6fa8c7"></i></div><div class="row" style="gap:6px">${[150,250,500].map(x=>`<button class="btn s x" onclick="addW(${x})">+${x}</button>`).join('')}<button class="btn s x" onclick="addW(-250)">-250</button></div>${c?'':`<label>Atur total hari ini (ml)</label><input type="number" min="0" max="10000" value="${w}" onchange="setW(this.value)">`}`}
function addW(x){const d=day();S.w[d]=Math.max(0,(S.w[d]||0)+x);save();render()}
function setW(v){v=+v;if(isNaN(v)||v<0||v>10000)return toast('Masukkan 0-10000 ml');S.w[day()]=Math.round(v);save();render()}
function db(){const l=allFoods().filter(f=>(cat=='Semua'||f.c==cat)&&f.n.toLowerCase().includes(q.toLowerCase()));
return`<h2>Food Database</h2><p class="mu">Makanan khas Indonesia dengan kalkulasi dari bahan baku. Nilai gizi bersifat estimasi (acuan umum TKPI Kemenkes), belum terverifikasi per produk.</p><div class="row"><input id="sq" placeholder="Cari makanan..." value="${esc(q)}" oninput="q=this.value;sr()"><button class="btn" onclick="openFood(null)">+ Buat dari bahan</button></div><div style="margin:12px 0">${CATS.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div id="fl" class="gr">${cards(l)}</div>`}
function allFoods(){return F.concat((S.rc||[]).map(r=>({...r,c:'Resep saya',e:'👩‍🍳'})))}
function cards(l){return l.map(f=>{const t=calc(f.k,f.m,1);return`<div class="cd fd" onclick="openFood('${f.id}')"><div class="em">${f.e}</div><div><b>${esc(f.n)}</b> <span class="tag">${f.c}</span><div class="mu">${f.po} · ${Math.round(t.g)} g · <b>${Math.round(t.k)} kkal</b></div><div class="mu">P ${r1(t.p)} · K ${r1(t.c)} · L ${r1(t.f)} · S ${r1(t.fi)}</div></div></div>`}).join('')||'<p class="mu">Tidak ditemukan.</p>'}
function sr(){const l=allFoods().filter(f=>(cat=='Semua'||f.c==cat)&&f.n.toLowerCase().includes(q.toLowerCase()));document.getElementById('fl').innerHTML=cards(l)}
function openFood(id,meal){const f=id&&allFoods().find(x=>x.id==id);cur=f?{n:f.n,k:f.k.map(x=>({...x})),m:f.m,x:1,meal:meal||'l',e:f.e}:{n:'',k:[],m:'tumis',x:1,meal:meal||'l',e:'🍽️'};showM()}
function showM(){const t=calc(cur.k,cur.m,cur.x),mb=document.getElementById('mb');
mb.innerHTML=`<div class="row" style="justify-content:space-between"><h3 style="flex:1">${cur.e} Detail makanan</h3><button class="btn s x" onclick="closeM()">Tutup</button></div><label>Nama makanan</label><input value="${esc(cur.n)}" onchange="cur.n=this.value" placeholder="Nama makanan / resep">
<div class="row"><div><label>Porsi (x)</label><select onchange="cur.x=+this.value;showM()">${[.5,.75,1,1.5,2,3].map(v=>`<option ${v==cur.x?'selected':''} value="${v}">${v}x</option>`).join('')}</select></div><div><label>Metode memasak</label><select onchange="cur.m=this.value;showM()">${Object.keys(M).map(k=>`<option value="${k}" ${k==cur.m?'selected':''}>${M[k][0]}${M[k][1]?' (+'+M[k][1]+' g minyak)':''}</option>`).join('')}</select></div></div>
<table style="margin-top:10px"><tr><th>Bahan</th><th>Gram</th><th>kkal</th><th></th></tr>${cur.k.map((i,n)=>`<tr><td>${I[i.id][0]}</td><td><input type="number" min="0" max="2000" value="${i.g}" onchange="chg(${n},this.value)"></td><td>${Math.round(I[i.id][1]*i.g*cur.x/100)}</td><td><button class="btn r x" onclick="cur.k.splice(${n},1);showM()">×</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Belum ada bahan.</td></tr>'}${M[cur.m][1]?`<tr><td>Minyak (${M[cur.m][0]})</td><td>${M[cur.m][1]}</td><td>${Math.round(M[cur.m][1]*cur.x*8.84)}</td><td></td></tr>`:''}</table>
<div class="row" style="margin-top:8px"><select id="ai">${Object.keys(I).map(k=>`<option value="${k}">${I[k][0]}</option>`).join('')}</select><input id="ag" type="number" min="1" max="2000" value="50" style="max-width:90px"><button class="btn s" onclick="addI()">Tambah</button></div>
<div class="cd" style="background:var(--gl);margin:14px 0"><div class="num">${Math.round(t.k)} kkal <span class="mu">· ${Math.round(t.g)} g</span></div><div class="mu">Protein ${r1(t.p)} g · Karbo ${r1(t.c)} g · Lemak ${r1(t.f)} g · Serat ${r1(t.fi)} g</div></div>
<div class="row"><select id="mm">${Object.keys(MEAL).map(k=>`<option value="${k}" ${k==cur.meal?'selected':''}>${MEAL[k]}</option>`).join('')}</select><button class="btn" onclick="logIt()">Catat ke Food Log</button><button class="btn s" onclick="saveR()">Simpan resep</button></div>`;document.getElementById('mod').classList.add('on')}
function chg(n,v){v=+v;if(isNaN(v)||v<0||v>2000)return toast('Gram 0-2000');cur.k[n].g=v;showM()}
function addI(){const g=+document.getElementById('ag').value;if(!(g>0&&g<=2000))return toast('Gram 1-2000');cur.k.push({id:document.getElementById('ai').value,g});showM()}
function closeM(){document.getElementById('mod').classList.remove('on')}
function logIt(){if(!cur.k.length)return toast('Tambahkan bahan dulu');const t=calc(cur.k,cur.m,cur.x),d=day();(S.log[d]=S.log[d]||[]).push({id:Date.now(),m:document.getElementById('mm').value,n:(cur.n||'Makanan saya')+(cur.x!=1?' ('+cur.x+'x)':''),k:t.k,p:t.p,c:t.c,f:t.f,fi:t.fi,g:t.g});save();closeM();toast('Tercatat');render()}
function saveR(){if(!cur.n.trim())return toast('Beri nama resep');if(!cur.k.length)return toast('Tambahkan bahan dulu');S.rc.push({id:'u'+Date.now(),n:cur.n.trim(),k:cur.k.map(x=>({...x,g:x.g*cur.x})),m:cur.m,t:'bld',po:'1 porsi'});save();toast('Resep disimpan');closeM();render()}
function log(){const d=day(),s=tot(d),t=T(S.p);return`<h2>Food Log</h2><p class="mu">Hari ini: <b>${Math.round(s.k)}</b> dari ${t.k} kkal.</p>${Object.keys(MEAL).map(m=>{const l=(S.log[d]||[]).filter(e=>e.m==m);return`<div class="cd"><div class="row" style="justify-content:space-between"><h3 style="flex:1">${MEAL[m]} · ${Math.round(l.reduce((a,e)=>a+e.k,0))} kkal</h3><button class="btn s x" onclick="pick('${m}')">+ Tambah</button></div>${l.map(e=>`<div class="li"><div><b>${esc(e.n)}</b><div class="mu">${Math.round(e.g)} g · P ${r1(e.p)} K ${r1(e.c)} L ${r1(e.f)}</div></div><div><b>${Math.round(e.k)}</b> kkal <button class="btn r x" onclick="del(${e.id})">Hapus</button></div></div>`).join('')||'<p class="mu">Belum ada catatan.</p>'}</div>`}).join('')}<p class="mu">Pengenalan makanan lewat foto membutuhkan layanan AI dan belum tersedia di versi ini.</p>`}
function pick(m){const mb=document.getElementById('mb');mb.innerHTML=`<div class="row" style="justify-content:space-between"><h3 style="flex:1">Tambah ${MEAL[m]}</h3><button class="btn s x" onclick="closeM()">Tutup</button></div><input placeholder="Cari makanan..." oninput="pl(this.value,'${m}')" style="margin:10px 0"><div id="pl"></div><button class="btn s" onclick="openFood(null,'${m}')">Masukkan bahan manual</button>`;document.getElementById('mod').classList.add('on');pl('',m)}
function pl(v,m){document.getElementById('pl').innerHTML=allFoods().filter(f=>f.n.toLowerCase().includes(v.toLowerCase())).slice(0,30).map(f=>`<div class="li fd" onclick="openFood('${f.id}','${m}')"><span>${f.e} ${esc(f.n)}</span><span class="mu">${Math.round(calc(f.k,f.m,1).k)} kkal</span></div>`).join('')}
function del(id){const d=day();S.log[d]=S.log[d].filter(e=>e.id!=id);save();render()}
function steps(f){const n=f.k.map(i=>I[i.id][0].toLowerCase()).join(', ');const w={rebus:'Rebus atau kukus bahan hingga matang, lalu bumbui.',panggang:'Marinasi bahan, lalu panggang hingga matang merata.',tumis:'Panaskan sedikit minyak, tumis bumbu hingga harum, masukkan bahan lain hingga matang.',goreng:'Panaskan minyak, goreng hingga kecokelatan, tiriskan.'}[f.m];return`<ol style="margin:6px 0;padding-left:18px"><li>Siapkan dan timbang bahan: ${n}.</li><li>${w}</li><li>Koreksi rasa dan sajikan hangat. Perbanyak sayur untuk gizi seimbang.</li></ol>`}
function rec(){const l=allFoods().filter(f=>(f.t||'').includes(rf));return`<h2>Recipes</h2><p class="mu">Menu Indonesia yang mudah dicari dan terjangkau.</p><div>${Object.keys(MEAL).map(k=>`<button class="chip ${k==rf?'on':''}" onclick="rf='${k}';render()">${MEAL[k]}</button>`).join('')}</div>${l.map(f=>{const t=calc(f.k,f.m,1);return`<details class="cd"><summary>${f.e} ${esc(f.n)} <span class="mu">· ${Math.round(t.k)} kkal · ${f.po}</span></summary><p class="mu">P ${r1(t.p)} g · K ${r1(t.c)} g · L ${r1(t.f)} g</p><b>Bahan</b><ul style="margin:4px 0;padding-left:18px">${f.k.map(i=>`<li>${I[i.id][0]} ${i.g} g</li>`).join('')}</ul><b>Cara memasak (${M[f.m][0]})</b>${steps(f)}<button class="btn s x" onclick="openFood('${f.id}','${rf}')">Hitung & catat</button></details>`}).join('')}`}
function prog(){const p=S.p,t=T(p),ds=[...Array(rng).keys()].reverse().map(o=>day(o)),lb=ds.map(x=>x.slice(8)),lg=ds.filter(x=>(S.log[x]||[]).length).length,d=day();
return`<h2>Progress</h2><p class="mu">Fokus pada kebiasaan, bukan hanya angka timbangan.</p><div class="chip ${rng==7?'on':''}" onclick="rng=7;render()">Mingguan</div><div class="chip ${rng==30?'on':''}" onclick="rng=30;render()">Bulanan</div>
<div class="gr"><div class="cd"><h3>Konsistensi pencatatan</h3><div class="num">${lg}/${rng} hari</div><div class="bar"><i style="width:${100*lg/rng}%"></i></div></div>
<div class="cd"><h3>Aktivitas hari ini (menit)</h3><input type="number" min="0" max="1440" value="${S.ac[d]||''}" placeholder="0" onchange="setM('ac',this.value,1440)"></div>
<div class="cd"><h3>Tidur semalam (jam)</h3><input type="number" min="0" max="24" step=".5" value="${S.sl[d]||''}" placeholder="0" onchange="setM('sl',this.value,24)"></div></div>
<div class="gr"><div class="cd"><h3>Energi (kkal)</h3>${bars(ds.map(x=>Math.round(tot(x).k)),lb,'var(--g)',t.k)}</div><div class="cd"><h3>Air (ml)</h3>${bars(ds.map(x=>S.w[x]||0),lb,'#6fa8c7',t.water)}</div><div class="cd"><h3>Aktivitas (menit)</h3>${bars(ds.map(x=>S.ac[x]||0),lb,'#c9a85c',30)}</div><div class="cd"><h3>Tidur (jam)</h3>${bars(ds.map(x=>S.sl[x]||0),lb,'#9a8fc7',8)}</div></div>`}
function setM(k,v,mx){v=+v;if(isNaN(v)||v<0||v>mx)return toast('Nilai tidak valid');S[k][day()]=v;save();render()}
function edu(){return`<h2>Education</h2><p class="mu">Informasi umum, merujuk pedoman Kemenkes (Isi Piringku) dan WHO. Bukan pengganti konsultasi tenaga kesehatan.</p>${EDU.map(e=>`<details class="cd acc"><summary>${e[0]}</summary><p>${e[1]}</p></details>`).join('')}`}
function prof(){const p=S.p,th=document.documentElement.dataset.theme||'';return`<h2>Profile & Settings</h2><div class="cd">${form(p)}<button class="btn" onclick="saveP()">Simpan perubahan</button></div>
<div class="cd"><h3>Preferensi makanan</h3><input id="pf" placeholder="mis. vegetarian, tanpa seafood" value="${esc(p.pref||'')}" onchange="S.p.pref=this.value;save()"></div>
<div class="cd"><h3>Pengingat makan & minum</h3><p class="mu">Muncul saat aplikasi terbuka.</p><label><input type="checkbox" style="width:auto" ${S.rm.on?'checked':''} onchange="S.rm.on=this.checked;save()"> Ingatkan makan</label><div class="row">${S.rm.t.map((x,i)=>`<input type="time" value="${x}" onchange="S.rm.t[${i}]=this.value;save()">`).join('')}</div><label><input type="checkbox" style="width:auto" ${S.rm.w?'checked':''} onchange="S.rm.w=this.checked;save()"> Ingatkan minum tiap 2 jam</label></div>
<div class="cd"><h3>Riwayat aktivitas</h3>${Object.keys(S.log).sort().reverse().slice(0,7).map(d=>`<div class="li"><span>${d}</span><span class="mu">${S.log[d].length} makanan · ${Math.round(tot(d).k)} kkal · air ${S.w[d]||0} ml</span></div>`).join('')||'<p class="mu">Belum ada riwayat.</p>'}</div>
<div class="cd"><h3>Privasi</h3><p class="mu">Data disimpan hanya di browser perangkat ini. Hapus semua data bila diperlukan.</p><button class="btn r" onclick="if(confirm('Hapus akun dan semua data? Tindakan ini tidak dapat dibatalkan.')){try{localStorage.removeItem('bl1')}catch(e){}S={p:null,log:{},w:{},sl:{},ac:{},rc:[],rm:{on:false,t:['07:30','12:30','19:00'],w:false}};ob=0;page='home';render()}">Hapus akun & data</button></div>`}
function form(p){p=p||{};return`<label>Nama</label><input id="fn" value="${esc(p.n||'')}" maxlength="40"><div class="row"><div><label>Umur (tahun)</label><input id="fa" type="number" value="${p.a||''}"></div><div><label>Jenis kelamin</label><select id="fs"><option value="m" ${p.s=='m'?'selected':''}>Laki-laki</option><option value="f" ${p.s=='f'?'selected':''}>Perempuan</option></select></div></div><div class="row"><div><label>Berat (kg)</label><input id="fw" type="number" step=".1" value="${p.w||''}"></div><div><label>Tinggi (cm)</label><input id="fh" type="number" value="${p.h||''}"></div></div><label>Tingkat aktivitas</label><select id="fc">${ACT.map((a,i)=>`<option value="${i}" ${p.act==i?'selected':''}>${a}</option>`).join('')}</select><label>Tujuan kesehatan</label><select id="fg">${Object.keys(GOAL).map(k=>`<option value="${k}" ${p.g==k?'selected':''}>${GOAL[k]}</option>`).join('')}</select><div style="height:14px"></div>`}
function readP(){const g=i=>document.getElementById(i).value,p={n:g('fn').trim(),a:+g('fa'),s:g('fs'),w:+g('fw'),h:+g('fh'),act:+g('fc'),g:g('fg'),pref:S.p&&S.p.pref||''};
if(!p.n)return toast('Nama wajib diisi');if(!(p.a>=10&&p.a<=100))return toast('Umur 10-100 tahun');if(!(p.w>=25&&p.w<=250))return toast('Berat 25-250 kg');if(!(p.h>=100&&p.h<=230))return toast('Tinggi 100-230 cm');return p}
function saveP(){const p=readP();if(!p)return;S.p=p;save();toast('Profil disimpan');render()}
const NAV=[['home','Home','⌂'],['db','Food Database','◍'],['log','Food Log','✎'],['rec','Recipes','❀'],['prog','Progress','↗'],['edu','Education','✦'],['prof','Profile','☺']];
function go(x){page=x;render();scrollTo(0,0)}
function render(){const root=document.getElementById('root');
if(!S.p){root.innerHTML=ob==0?`<div class="hero"><div class="big">🌿</div><h1>BETTER LIFE</h1><p style="font-size:18px">Build Better Habits, Live a Better Life.</p><p class="mu" style="max-width:380px">Asisten kesehatan pribadi untuk mengatur pola makan, nutrisi, dan kebiasaan sehat dengan makanan Indonesia.</p><button class="btn" style="padding:14px 34px;font-size:16px" onclick="ob=1;render()">Get Started</button></div>`:`<div style="max-width:480px;margin:0 auto;padding:24px"><div class="logo">BETTER LIFE</div><h2>Kenalan dulu, yuk</h2><div class="cd">${form(null)}<button class="btn" style="width:100%" onclick="startP()">Hitung kebutuhan saya</button></div></div>`;return}
const nv=(c)=>NAV.map(n=>c?`<button class="${page==n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[2]}</b>${n[1].split(' ')[0]}</button>`:`<button class="nv ${page==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join('');
root.innerHTML=`<div id="app"><nav id="side"><div class="logo">BETTER LIFE<small>Build Better Habits</small></div>${nv(0)}</nav><main id="main">${{home,db,log,rec,prog,edu,prof}[page]()}</main></div><nav id="bn">${nv(1)}</nav>`}
function startP(){const p=readP();if(!p)return;S.p=p;save();page='home';render()}
setInterval(()=>{if(!S.p)return;const n=new Date(),hm=n.toTimeString().slice(0,5);if(S.rm.on&&S.rm.t.includes(hm)&&n.getSeconds()<30&&toast.l!=hm){toast.l=hm;toast('Waktunya makan 🍽️')}if(S.rm.w&&n.getMinutes()==0&&n.getHours()%2==0&&toast.l!=hm){toast.l=hm;toast('Waktunya minum 💧')}},20000);
render();
</script></body></html>
